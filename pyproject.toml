[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttvttm"
version = "0.1.0"
description = "Music Player for Tango"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "PySide6",
  "pydub",
  "audioread",
  "mutagen",
]

license = { text = "MIT License" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Topic :: Multimedia :: Sound/Audio :: Players",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = [
  "nose",
  "pytest",
]
dev = [
  "uv",
  "ruff",
  "mypy",
  "lizard",
]

[tool.ruff]
line-length = 88
exclude = [".venv", "build", "dist", "ttvttm.egg-info", "__pycache__", "tools", "uiredesign"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C", "UP", "Q"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
strict_optional = true
exclude = "(^\\.venv|build|dist|ttvttm\\.egg-info)"

[project.scripts]
ttvttm = "tools.ttvttm_cli:main"

[project.urls]
Homepage = "https://example.com/ttvttm"
Download = "https://example.com/ttvttm/download"

[tool.setuptools.packages.find]
where = ["."]
include = ["ttvttm", "tools", "tests"]

[tool.setuptools.package-data]
"ttvttm" = ["qml/*"]
